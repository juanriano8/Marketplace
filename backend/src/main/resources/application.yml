server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: marketplace-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: MarketplaceHikariCP
      max-lifetime: 2000000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Collections are LAZY and loaded in batches: avoids N+1 selects and the
        # "cannot simultaneously fetch multiple bags" failure during paginated queries.
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  payment:
    stub:
      # When false the stub gateway leaves payments PENDING so the failure/retry branch of
      # checkout can be exercised locally.
      always-capture: ${PAYMENT_STUB_CAPTURE:true}
  bootstrap:
    admin:
      # Set both values once to have the first administrator created on startup, otherwise the
      # /api/v1/admin/** endpoints cannot be called (there is no public admin registration).
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.marketplace.api: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
