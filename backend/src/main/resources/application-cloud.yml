# ============================================================================
# Perfil para Google Cloud SQL (PostgreSQL)
# ----------------------------------------------------------------------------
# Actívalo con:  --spring.profiles.active=cloud
# o con:         SPRING_PROFILES_ACTIVE=cloud
#
# Todas las credenciales se leen de variables de entorno para que nunca queden
# escritas en el repositorio (la especificación pide GCP Secret Manager).
# ============================================================================

spring:
  datasource:
    # El host puede ser:
    #  a) la IP pública de la instancia Cloud SQL  -> 35.x.x.x
    #  b) la IP privada (requiere VPC Connector)   -> 10.x.x.x
    #  c) 127.0.0.1 si usas el Cloud SQL Auth Proxy en local
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}&connectTimeout=15&socketTimeout=60
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Cloud SQL cierra conexiones ociosas; estos valores evitan "connection reset"
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 120000
      max-lifetime: 600000
      keepalive-time: 60000
      pool-name: MarketplaceCloudSqlPool
      # Cloud SQL no admite nombres de prepared statement repetidos entre conexiones
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      # "update" crea/actualiza el esquema automáticamente: cómodo para la demo.
      # Para producción usar "validate" + migraciones versionadas (Flyway/Liquibase).
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

app:
  payment:
    stub:
      always-capture: ${PAYMENT_STUB_CAPTURE:true}

# Sin Redis en la demo: el rate limiting vive en Bucket4j (en memoria) y la caché
# de catálogo en Caffeine/SQL mientras no haya VPC Connector hacia Memorystore.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.marketplace.api: INFO
    # Descomenta para diagnosticar problemas de conexión con Cloud SQL:
    # com.zaxxer.hikari: DEBUG
    # org.hibernate.SQL: DEBUG
